# Publica o site no GitHub Pages e gera assets/config.js a partir dos secrets do repositório.
# Nenhum endereço ou credencial fica no código: tudo vem de Settings → Secrets and variables → Actions.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar assets/config.js a partir dos secrets
        env:
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
        run: |
          if [ -z "$FORM_ENDPOINT" ]; then
            echo "::warning::Secret FORM_ENDPOINT não configurado: o formulário de proposta não vai enviar."
          fi
          node -e 'require("fs").writeFileSync("assets/config.js","window.STILL_CONFIG="+JSON.stringify({formEndpoint:process.env.FORM_ENDPOINT||""})+";\n")'

      - name: Montar pasta do site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
