# Publica o site no GitHub Pages. O destino do formulário vem do secret FORM_ENDPOINT
# (Settings → Secrets and variables → Actions) e nunca fica no código.
# Actions presas por commit (SHA) para evitar troca silenciosa de versão; o Dependabot avisa quando houver atualização.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Montar site (config, Content-Security-Policy e verificações)
        env:
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
        run: node tools/build.js _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
